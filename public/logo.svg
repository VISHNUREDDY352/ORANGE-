<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Outer Glow & Drop Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="frostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>

    <!-- Vibrant Citrus Orange Radial Gradient -->
    <radialGradient id="orangeBallGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFD269"/>
      <stop offset="25%" stop-color="#FF8A00"/>
      <stop offset="65%" stop-color="#F25100"/>
      <stop offset="100%" stop-color="#BA2F00"/>
    </radialGradient>

    <!-- Frost Ice Blue Inner Disc Gradient -->
    <radialGradient id="frostAura" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Citrus Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Top Gloss Shine -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Natural Stem -->
    <path d="M 49 19 Q 47 11 54 8 Q 51 12 51 18 Z" fill="#78350F" />

    <!-- Lush Green Leaf with Frost Tip -->
    <path d="M 50 18 C 52 8, 74 7, 74 19 C 74 27, 56 26, 50 18 Z" fill="url(#leafGrad)" />
    <path d="M 52 17 Q 62 13 71 18" stroke="#DCFCE7" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Main Orange Sphere Body -->
    <circle cx="50" cy="54" r="37" fill="url(#orangeBallGrad)"/>

    <!-- Subtle Golden Outer Rim -->
    <circle cx="50" cy="54" r="36.5" fill="none" stroke="#FFAE52" stroke-width="1" opacity="0.65"/>

    <!-- Frosted Refrigeration Core Lens (Cooling aura) -->
    <circle cx="50" cy="54" r="27.5" fill="url(#frostAura)"/>
    <circle cx="50" cy="54" r="27.5" fill="none" stroke="#BAE6FD" stroke-width="1.2" opacity="0.6"/>

    <!-- Ac Cooling Airflow Wave Rings -->
    <path d="M 28 66 Q 50 78 72 66" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
    <path d="M 33 72 Q 50 81 67 72" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

    <!-- Precision Central Snowflake (Refrigeration & Cooling Symbol) -->
    <g filter="url(#frostGlow)">
      <line x1="50.0" y1="54.0" x2="50.0" y2="34.0" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="50.0,31.5 52.2,34.5 50.0,37.5 47.8,34.5" fill="#FFFFFF"/>
    <line x1="50.0" y1="43.0" x2="45.0" y2="38.8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50.0" y1="43.0" x2="55.0" y2="38.8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50.0" y1="48.0" x2="46.9" y2="45.8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="48.0" x2="53.1" y2="45.8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="54.0" x2="67.3" y2="44.0" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="69.5,42.8 68.0,46.2 64.3,45.8 65.8,42.3" fill="#FFFFFF"/>
    <line x1="59.5" y1="48.5" x2="60.7" y2="42.1" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="59.5" y1="48.5" x2="65.6" y2="50.7" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="55.2" y1="51.0" x2="55.5" y2="47.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="55.2" y1="51.0" x2="58.6" y2="52.6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="54.0" x2="67.3" y2="64.0" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="69.5,65.2 65.8,65.7 64.3,62.2 68.0,61.8" fill="#FFFFFF"/>
    <line x1="59.5" y1="59.5" x2="65.6" y2="57.3" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="59.5" y1="59.5" x2="60.7" y2="65.9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="55.2" y1="57.0" x2="58.6" y2="55.4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="55.2" y1="57.0" x2="55.5" y2="60.8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="54.0" x2="50.0" y2="74.0" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="50.0,76.5 47.8,73.5 50.0,70.5 52.2,73.5" fill="#FFFFFF"/>
    <line x1="50.0" y1="65.0" x2="55.0" y2="69.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50.0" y1="65.0" x2="45.0" y2="69.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50.0" y1="60.0" x2="53.1" y2="62.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="60.0" x2="46.9" y2="62.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="54.0" x2="32.7" y2="64.0" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="30.5,65.2 32.0,61.8 35.7,62.2 34.2,65.7" fill="#FFFFFF"/>
    <line x1="40.5" y1="59.5" x2="39.3" y2="65.9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="40.5" y1="59.5" x2="34.4" y2="57.3" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="44.8" y1="57.0" x2="44.5" y2="60.8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="44.8" y1="57.0" x2="41.4" y2="55.4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50.0" y1="54.0" x2="32.7" y2="44.0" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="30.5,42.8 34.2,42.3 35.7,45.8 32.0,46.2" fill="#FFFFFF"/>
    <line x1="40.5" y1="48.5" x2="34.4" y2="50.7" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="40.5" y1="48.5" x2="39.3" y2="42.1" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="44.8" y1="51.0" x2="41.4" y2="52.6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="44.8" y1="51.0" x2="44.5" y2="47.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Central Gem / Node -->
      <circle cx="50" cy="54" r="4.5" fill="#FFFFFF"/>
      <circle cx="50" cy="54" r="2.2" fill="#0284C7"/>
    </g>

    <!-- Top Left Glossy 3D Sphere Highlight -->
    <ellipse cx="40" cy="31" rx="14" ry="7" fill="url(#glossGrad)" transform="rotate(-30 40 31)"/>

    <!-- Clean Sparkle Star (upper left shine) -->
    <path d="M 28 32 Q 28 36 24 36 Q 28 36 28 40 Q 28 36 32 36 Q 28 36 28 32 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>