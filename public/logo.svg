<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFD175" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="85%" stop-color="#E04800" />
      <stop offset="100%" stop-color="#B83200" />
    </radialGradient>
    
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Green Leaf -->
  <path d="M 50 26 C 50 10, 78 12, 76 27 C 76 38, 55 35, 50 26 Z" fill="url(#leafGrad)" />
  <path d="M 52 24 Q 63 19 72 26" stroke="#C8E6C9" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Stem -->
  <path d="M 50 26 Q 47 34 50 38" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Main Orange Sphere -->
  <circle cx="50" cy="60" r="34" fill="url(#orangeGrad)" />

  <!-- Glossy Reflection Highlight -->
  <ellipse cx="42" cy="42" rx="14" ry="8" fill="url(#glossGrad)" transform="rotate(-25 42 42)" />
</svg>
